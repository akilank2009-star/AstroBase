<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Access | Astrobase</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <h2>Astrobase</h2>

        <nav>

            <a href="http://127.0.0.1:5000/">
                Home
            </a>

            <a href="http://127.0.0.1:5500/Website/HTML/explore.html">
                Explore
            </a>

            <a href="http://127.0.0.1:5500/Website/HTML/community.html">
                Community
            </a>

            <a href="http://127.0.0.1:5500/Website/HTML/about.html">
                About
            </a>

            <a href="http://127.0.0.1:5000/login">
                Login
            </a>

            <a href="http://127.0.0.1:5500/Website/HTML/join.html">
                Join Astrobase
            </a>

        </nav>

    </header>


    <main>

        <section class="admin-login-section">

            <p class="explore-label">
                PLATFORM ACCESS
            </p>

            <h1>
                Admin Access
            </h1>

            <p>
                Sign in to manage Astrobase and review platform
                submissions.
            </p>


            <form action="/admin/login" method="POST">

                <label for="email">
                    Email or Username
                </label>

                <input
                    type="text"
                    id="email"
                    name="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >


                <button type="submit">
                    Admin Login
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Astrobase
        </p>

    </footer>

</body>

</html>
