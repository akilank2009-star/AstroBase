<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Organisation Account | Astrobase</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <h2>Astrobase</h2>

        <nav>

            <a href="http://127.0.0.1:5000/">
                Home
            </a>

            <a href="http://127.0.0.1:5000/login">
                Login
            </a>

            <a href="http://127.0.0.1:5500/Website/HTML/join.html">
                Join Astrobase
            </a>

        </nav>

    </header>


    <main>

        <section class="organisation-register-section">

            <p class="explore-label">
                VERIFIED ORGANISATION
            </p>

            <h1>
                Create Organisation Account
            </h1>

            <p class="organisation-register-intro">
                Create an account to manage your organisation on Astrobase.
            </p>


            <form
                action="/organisation/register"
                method="POST"
            >

                <h2>
                    Organisation Account
                </h2>


                <label for="organisation_name">

                    Organisation Name

                </label>

                <input
                    type="text"
                    id="organisation_name"
                    name="organisation_name"
                    required
                >


                <label for="email">

                    Organisation Email

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >


                <label for="confirm_password">

                    Confirm Password

                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                >


                <button type="submit">

                    Create Organisation Account

                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Astrobase
        </p>

    </footer>

</body>

</html>
